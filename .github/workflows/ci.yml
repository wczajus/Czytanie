name: CI

# IMPORTANT: this workflow must never upload artifacts (no actions/upload-artifact).
# The account has no Actions artifact storage left; builds are published only as GitHub Releases
# (see release.yml). Reports are printed to the job log instead.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the Gradle cache; PRs read it. The cache is not artifact storage.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check (lint, detekt, ktlint, unit tests)
        run: ./gradlew check --continue --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug
