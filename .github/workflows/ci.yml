name: CI

# IMPORTANT: this workflow must never upload artifacts (no actions/upload-artifact).
# The account has no Actions artifact storage left; builds are published only as GitHub Releases
# (see release.yml). Reports are printed to the job log instead.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the Gradle cache; PRs read it. The cache is not artifact storage.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # TEMPORARY (E3 bootstrap, D37): record the first reference screenshots and print them to the
      # log as base64 so they can be reviewed and committed. Remove once they are in the repository.
      - name: Record reference screenshots (bootstrap)
        run: |
          ./gradlew :feature:reading:recordRoborazziDebug --stacktrace
          for f in feature/reading/src/test/snapshots/*.png; do
            echo "----- BEGIN $f -----"
            base64 -w0 "$f"; echo
            echo "----- END $f -----"
          done

      - name: Check (lint, detekt, ktlint, unit tests, screenshots)
        run: ./gradlew check --continue --stacktrace

      # Room writes exported schemas during the build; they must be committed for migration tests.
      # The content is printed (no artifacts) so it can be copied into the commit.
      - name: Room schemas are committed
        run: |
          changed=$(git status --porcelain --untracked-files=all -- core/data/schemas | awk '{print $2}')
          if [ -n "$changed" ]; then
            for f in $changed; do
              echo "::group::$f"
              echo "----- BEGIN $f -----"
              cat "$f"; echo
              echo "----- END $f -----"
              echo "::endgroup::"
            done
            echo "::error::Room schema changed but is not committed: $changed"
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug
